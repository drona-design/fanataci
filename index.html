<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bomberman Ultimate - IA MEJORADA (Bombas Funcionando)</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #020408 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #1e2f2b;
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 5px #aa7942, 0 0 0 12px #5c3a1a;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 12px;
            flex-wrap: wrap;
            background: #0f171cee;
            padding: 8px 18px;
            border-radius: 60px;
        }
        .controls, .status, .vivos {
            background: #00000099;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: bold;
        }
        .status { font-size: 18px; background: #1e1b14; color: #f7d44a; }
        button {
            background: #f0a445;
            border: none;
            padding: 6px 20px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            font-family: monospace;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 #7a3e1a;
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a3e1a; }
        .stats-container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 14px;
        }
        .player-stat {
            background: #0b0f18dd;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            color: #ffde9c;
        }
        .ranking {
            background: #0b111fcc;
            padding: 12px 16px;
            border-radius: 28px;
            font-size: 11px;
            text-align: center;
            margin-top: 14px;
            font-weight: bold;
            color: #ffdd99;
        }
        .difficulty-select {
            margin-left: 10px;
            background: #2a2418;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: bold;
            color: #ffcf8a;
            border: none;
            font-family: monospace;
            cursor: pointer;
        }
        @media (max-width: 780px) {
            canvas { width: 100%; height: auto; }
            .info { flex-direction: row; justify-content: center; }
        }
    </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center;">
    <div class="game-container">
        <canvas id="gameCanvas" width="650" height="650" tabindex="0"></canvas>
        <div class="info">
            <div class="controls">?? ???? | [?] ?? | Dificultad: 
                <select id="difficultySelect" class="difficulty-select">
                    <option value="easy">EASY</option>
                    <option value="normal" selected>NORMAL</option>
                    <option value="hard">HARD</option>
                    <option value="nightmare">NIGHTMARE</option>
                </select>
            </div>
            <div class="status" id="gameStatus">?? BATALLA</div>
            <div class="vivos" id="vivosCount">?? Vivos: 5/5</div>
            <button id="resetBtn">?? REINICIAR</button>
        </div>
        <div class="stats-container" id="statsContainer"></div>
        <div id="rankingContainer" class="ranking">?? ESPERA DEL COMBATE ??</div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('gameStatus');
        const vivosDiv = document.getElementById('vivosCount');
        const statsContainer = document.getElementById('statsContainer');
        const rankingContainer = document.getElementById('rankingContainer');
        const difficultySelect = document.getElementById('difficultySelect');
        
        canvas.focus();
        canvas.addEventListener('click', () => canvas.focus());
        
        const CELL_SIZE = 50;
        const MAP_SIZE = 13;
        const TILE_EMPTY = 0;
        const TILE_WALL = 1;
        const TILE_BRICK = 2;
        
        const POWERUP_RANGE = 0;
        const POWERUP_BOMBS = 1;
        const POWERUP_SPEED = 2;
        
        const PLAYER_COUNT = 5;
        const HUMAN_ID = 0;
        
        const PLAYER_COLORS = ["#E34D4D", "#4AE87A", "#5A8CFF", "#F5D742", "#E86EFF"];
        const PLAYER_NAMES = ["H ROE", "FURIA", "CRACK", "SOMBRA", "MAESTRO"];
        
        let map = [];
        let players = [];
        let bombs = [];
        let explosions = [];
        let powerups = [];
        let gameRunning = true;
        let cameraShake = 0;
        
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        let pendingDirection = null;
        
        function getDifficulty() {
            const val = difficultySelect.value;
            if(val === 'easy') return { reactionDelay: 25, detectRange: 5, bombChance: 0.5 };
            if(val === 'hard') return { reactionDelay: 10, detectRange: 9, bombChance: 0.85 };
            if(val === 'nightmare') return { reactionDelay: 5, detectRange: 12, bombChance: 0.95 };
            return { reactionDelay: 18, detectRange: 7, bombChance: 0.7 };
        }
        
        class Player {
            constructor(id, name, color, startX, startY, isHuman, aiType = null) {
                this.id = id;
                this.name = name;
                this.color = color;
                this.isHuman = isHuman;
                this.aiType = aiType || (isHuman ? null : ["aggressive","destroyer","coward","ambusher","expert"][id % 5]);
                
                this.gridX = startX; this.gridY = startY;
                this.pixelX = startX * CELL_SIZE; this.pixelY = startY * CELL_SIZE;
                this.moveState = 0; this.moveDirection = null; this.moveProgress = 0;
                this.animFrame = 0; this.animCounter = 0; this.walkBob = 0;
                this.alive = true;
                this.bombRange = 2; this.maxBombs = 1; this.bombsPlaced = 0; this.bombCooldown = 0;
                this.speedBoost = 0; this.baseSpeed = 4.5;
                
                this.aiDecisionCooldown = 0;
                this.currentMoveTarget = null;
                this.lastSeenPlayerX = null;
                this.lastSeenPlayerY = null;
                this.memoryTimer = 0;
                
                this.kills = 0; this.bombsPlacedTotal = 0; this.bricksDestroyed = 0;
                this.powerupsCollected = 0; this.suicides = 0;
                this.survivalTime = 0;
                this.lastBombX = -1; this.lastBombY = -1;
            }
            
            getSpeed() { let s = this.baseSpeed + (this.speedBoost * 1.8); return Math.min(8.5, s); }
            
            canMoveTo(dx, dy, ignoreBombs = false, considerOwner = true) {
                let nx = this.gridX+dx, ny = this.gridY+dy;
                if(nx<0 || nx>=MAP_SIZE || ny<0 || ny>=MAP_SIZE) return false;
                if(map[ny][nx] === TILE_WALL || map[ny][nx] === TILE_BRICK) return false;
                if(!ignoreBombs) {
                    for(let b of bombs) {
                        if(b.x===nx && b.y===ny) {
                            if(considerOwner && b.ownerId===this.id && b.ownerCanPass) continue;
                            return false;
                        }
                    }
                }
                return true;
            }
            
            startMove(direction) {
                if(this.moveState === 1) return false;
                let dx=0,dy=0;
                if(direction==='up') dy=-1;
                else if(direction==='down') dy=1;
                else if(direction==='left') dx=-1;
                else if(direction==='right') dx=1;
                if(this.canMoveTo(dx,dy,false,true)) {
                    this.moveState=1; 
                    this.moveDirection=direction; 
                    this.moveProgress=0;
                    return true;
                }
                return false;
            }
            
            updateMove() {
                if(this.moveState!==1) return;
                this.moveProgress += this.getSpeed();
                this.walkBob = Math.sin(Date.now() * 0.015) * 2;
                this.animCounter++; 
                if(this.animCounter>4) { 
                    this.animCounter=0; 
                    this.animFrame=(this.animFrame+1)%4; 
                }
                if(this.moveProgress>=CELL_SIZE) this.finishMove();
                else this.updatePixelPosition();
            }
            
            finishMove() {
                if(this.moveDirection==='up') this.gridY--;
                else if(this.moveDirection==='down') this.gridY++;
                else if(this.moveDirection==='left') this.gridX--;
                else if(this.moveDirection==='right') this.gridX++;
                this.pixelX=this.gridX*CELL_SIZE; 
                this.pixelY=this.gridY*CELL_SIZE;
                this.moveState=0; 
                this.moveDirection=null; 
                this.moveProgress=0;
                for(let b of bombs) {
                    if(b.x===this.gridX && b.y===this.gridY && b.ownerId===this.id) {
                        b.ownerCanPass=false;
                    }
                }
                if(this.isHuman && pendingDirection && gameRunning && this.alive) { 
                    this.startMove(pendingDirection); 
                    pendingDirection=null; 
                }
            }
            
            updatePixelPosition() {
                let off = this.moveProgress;
                if(this.moveDirection==='up') { 
                    this.pixelY=this.gridY*CELL_SIZE-off; 
                    this.pixelX=this.gridX*CELL_SIZE; 
                } else if(this.moveDirection==='down') { 
                    this.pixelY=this.gridY*CELL_SIZE+off; 
                    this.pixelX=this.gridX*CELL_SIZE; 
                } else if(this.moveDirection==='left') { 
                    this.pixelX=this.gridX*CELL_SIZE-off; 
                    this.pixelY=this.gridY*CELL_SIZE; 
                } else if(this.moveDirection==='right') { 
                    this.pixelX=this.gridX*CELL_SIZE+off; 
                    this.pixelY=this.gridY*CELL_SIZE; 
                }
            }
            
            // CORREGIDO: Verifica si hay una ruta de escape despu s de poner bomba
            hasEscapeRoute() {
                // Simular zona de explosi n
                let explosionZone = Array(MAP_SIZE).fill().map(()=>Array(MAP_SIZE).fill(false));
                explosionZone[this.gridY][this.gridX] = true;
                let dirs = [[0,-1],[0,1],[-1,0],[1,0]];
                for(let [dx,dy] of dirs) {
                    for(let r=1; r<=this.bombRange; r++) {
                        let nx=this.gridX+dx*r, ny=this.gridY+dy*r;
                        if(nx<0||nx>=MAP_SIZE||ny<0||ny>=MAP_SIZE) break;
                        if(map[ny][nx]===TILE_WALL) break;
                        explosionZone[ny][nx]=true;
                        if(map[ny][nx]===TILE_BRICK) break;
                    }
                }
                
                // BFS para encontrar escape
                let queue = [{x:this.gridX, y:this.gridY}];
                let visited = new Set();
                visited.add(this.gridX+","+this.gridY);
                let head = 0;
                
                while(head < queue.length) {
                    let node = queue[head++];
                    if(!explosionZone[node.y][node.x]) return true;
                    
                    for(let [dx,dy] of dirs) {
                        let nx=node.x+dx, ny=node.y+dy;
                        let key = nx+","+ny;
                        if(nx<0||nx>=MAP_SIZE||ny<0||ny>=MAP_SIZE) continue;
                        if(visited.has(key)) continue;
                        if(map[ny][nx] !== TILE_EMPTY) continue;
                        // Puede pasar sobre bombas propias durante el escape
                        let bombBlock = false;
                        for(let b of bombs) {
                            if(b.x===nx && b.y===ny && b.ownerId !== this.id) {
                                bombBlock = true;
                                break;
                            }
                        }
                        if(bombBlock) continue;
                        visited.add(key);
                        queue.push({x:nx, y:ny});
                    }
                }
                return false;
            }
            
            // CORREGIDO: Decisi n de poner bomba m s agresiva y confiable
            tryPlaceBomb() {
                if(!this.alive) return false;
                if(this.bombCooldown > 0) return false;
                if(this.bombsPlaced >= this.maxBombs) return false;
                
                // Verificar si ya hay bomba en esta celda
                for(let b of bombs) {
                    if(b.x === this.gridX && b.y === this.gridY) return false;
                }
                
                // Evitar spam excesivo
                if(this.gridX === this.lastBombX && this.gridY === this.lastBombY && Math.random() > 0.3) {
                    return false;
                }
                
                // Para IA: verificar que no sea suicidio seguro
                if(!this.isHuman && !this.hasEscapeRoute()) {
                    // Si no hay escape, solo poner bomba si hay enemigo muy cerca (sacrificio ofensivo)
                    let enemyAdjacent = false;
                    for(let p of players) {
                        if(p.alive && p.id !== this.id) {
                            let dist = Math.abs(p.gridX - this.gridX) + Math.abs(p.gridY - this.gridY);
                            if(dist <= 2) {
                                enemyAdjacent = true;
                                break;
                            }
                        }
                    }
                    if(!enemyAdjacent) return false;
                }
                
                // Colocar bomba
                bombs.push({ 
                    x: this.gridX, 
                    y: this.gridY, 
                    range: this.bombRange, 
                    timer: 70, 
                    ownerId: this.id, 
                    ownerCanPass: true 
                });
                this.bombsPlaced++;
                this.bombsPlacedTotal++;
                this.bombCooldown = 28;
                this.lastBombX = this.gridX;
                this.lastBombY = this.gridY;
                return true;
            }
            
            shouldBombNow(difficulty) {
                if(this.bombCooldown > 0) return false;
                if(this.bombsPlaced >= this.maxBombs) return false;
                
                // Razones para poner bomba:
                // 1. Hay un enemigo en l nea recta
                for(let p of players) {
                    if(!p.alive || p.id === this.id) continue;
                    if((p.gridX === this.gridX || p.gridY === this.gridY)) {
                        let dist = Math.abs(p.gridX - this.gridX) + Math.abs(p.gridY - this.gridY);
                        if(dist <= this.bombRange && dist > 0) return true;
                    }
                }
                
                // 2. Hay ladrillos adyacentes (destructor)
                if(this.hasAdjacentBrick() && Math.random() < difficulty.bombChance) return true;
                
                // 3. Rol espec fico: agresivo siempre que pueda
                if(this.aiType === "aggressive" && Math.random() < 0.4) return true;
                
                // 4. Emboscador: espera emboscada
                if(this.aiType === "ambusher" && this.hasAdjacentBrick() && Math.random() < 0.5) return true;
                
                return false;
            }
            
            updateCooldown() { 
                if(this.bombCooldown>0) this.bombCooldown--; 
                if(this.alive) this.survivalTime++;
                if(this.memoryTimer > 0) this.memoryTimer--;
            }
            
            applyPowerup(type) {
                if(type===POWERUP_RANGE) this.bombRange=Math.min(5,this.bombRange+1);
                else if(type===POWERUP_BOMBS) this.maxBombs=Math.min(5,this.maxBombs+1);
                else if(type===POWERUP_SPEED) this.speedBoost=Math.min(2,this.speedBoost+1);
                this.powerupsCollected++;
            }
            
            die() { 
                if(!this.alive) return; 
                this.alive=false; 
                for(let i=0;i<bombs.length;i++) {
                    if(bombs[i].ownerId===this.id) bombs.splice(i--,1);
                }
            }
            
            addKill() { this.kills++; }
            addBrickDestroyed() { this.bricksDestroyed++; }
            isMoving() { return this.moveState===1; }
            
            hasAdjacentBrick() { 
                const d=[[0,-1],[0,1],[-1,0],[1,0]]; 
                for(let [dx,dy] of d) { 
                    let nx=this.gridX+dx, ny=this.gridY+dy; 
                    if(nx>=0 && nx<MAP_SIZE && ny>=0 && ny<MAP_SIZE && map[ny][nx]===TILE_BRICK) return true; 
                } 
                return false; 
            }
        }
        
        // --- A* PATHFINDING ---
        function aStarPath(start, target, ignoreBombs=false) {
            let openSet = [{x:start.x, y:start.y, g:0, h:Math.abs(start.x-target.x)+Math.abs(start.y-target.y), f:0, parent:null}];
            let closedSet = new Set();
            let gScore = new Map();
            gScore.set(`${start.x},${start.y}`,0);
            
            while(openSet.length) {
                openSet.sort((a,b)=>a.f-b.f);
                let current = openSet.shift();
                
                if(current.x===target.x && current.y===target.y) {
                    let path = [];
                    let cur = current;
                    while(cur.parent) { 
                        path.unshift({x:cur.x, y:cur.y}); 
                        cur = cur.parent; 
                    }
                    if(path.length===0) return null;
                    let first = path[0];
                    if(first.x===start.x+1) return 'right';
                    if(first.x===start.x-1) return 'left';
                    if(first.y===start.y+1) return 'down';
                    if(first.y===start.y-1) return 'up';
                    return null;
                }
                
                let key = `${current.x},${current.y}`;
                if(closedSet.has(key)) continue;
                closedSet.add(key);
                
                let dirs = [{name:'up',dx:0,dy:-1},{name:'down',dx:0,dy:1},{name:'left',dx:-1,dy:0},{name:'right',dx:1,dy:0}];
                for(let dir of dirs) {
                    let nx=current.x+dir.dx, ny=current.y+dir.dy;
                    if(nx<0||nx>=MAP_SIZE||ny<0||ny>=MAP_SIZE) continue;
                    if(map[ny][nx] !== TILE_EMPTY) continue;
                    if(!ignoreBombs) {
                        let bombBlock = false;
                        for(let b of bombs) {
                            if(b.x===nx && b.y===ny) { bombBlock=true; break; }
                        }
                        if(bombBlock) continue;
                    }
                    let tentativeG = current.g + 1;
                    let nkey = `${nx},${ny}`;
                    if(!gScore.has(nkey) || tentativeG < gScore.get(nkey)) {
                        gScore.set(nkey, tentativeG);
                        let h = Math.abs(nx-target.x)+Math.abs(ny-target.y);
                        let f = tentativeG + h;
                        openSet.push({x:nx, y:ny, g:tentativeG, h:h, f:f, parent:current});
                    }
                }
            }
            return null;
        }
        
        function updateBots() {
            let diff = getDifficulty();
            
            for(let p of players) {
                if(p.isHuman) continue;
                if(!p.alive) continue;
                if(p.isMoving()) continue;
                
                // CORREGIDO: Actualizar memoria del enemigo
                let nearestEnemy = null;
                let minDist = 999;
                for(let enemy of players) {
                    if(enemy.alive && enemy.id !== p.id) {
                        let dist = Math.abs(enemy.gridX - p.gridX) + Math.abs(enemy.gridY - p.gridY);
                        if(dist < minDist) {
                            minDist = dist;
                            nearestEnemy = enemy;
                        }
                    }
                }
                
                if(nearestEnemy && minDist < diff.detectRange) {
                    p.lastSeenPlayerX = nearestEnemy.gridX;
                    p.lastSeenPlayerY = nearestEnemy.gridY;
                    p.memoryTimer = 50;
                }
                
                // CORREGIDO: Decisi n de poner bomba AHORA
                if(p.shouldBombNow(diff)) {
                    p.tryPlaceBomb();
                }
                
                // Decisi n de movimiento
                if(p.aiDecisionCooldown > 0) {
                    p.aiDecisionCooldown--;
                    if(p.currentMoveTarget && p.startMove(p.currentMoveTarget)) {
                        continue;
                    }
                }
                
                // Determinar objetivo
                let targetPos = null;
                if(p.memoryTimer > 0 && p.lastSeenPlayerX !== null) {
                    targetPos = {x: p.lastSeenPlayerX, y: p.lastSeenPlayerY};
                } else if(nearestEnemy) {
                    targetPos = {x: nearestEnemy.gridX, y: nearestEnemy.gridY};
                }
                
                let move = null;
                
                // Movimiento seg n personalidad
                if(p.aiType === "aggressive" && targetPos) {
                    move = aStarPath({x:p.gridX, y:p.gridY}, targetPos, false);
                } else if(p.aiType === "destroyer") {
                    // Buscar ladrillos cercanos
                    let bestBrick = null;
                    let bestDistBrick = 999;
                    for(let y=0; y<MAP_SIZE; y++) {
                        for(let x=0; x<MAP_SIZE; x++) {
                            if(map[y][x] === TILE_BRICK) {
                                let dist = Math.abs(x-p.gridX) + Math.abs(y-p.gridY);
                                if(dist < bestDistBrick && dist < 8) {
                                    bestDistBrick = dist;
                                    bestBrick = {x, y};
                                }
                            }
                        }
                    }
                    if(bestBrick) move = aStarPath({x:p.gridX, y:p.gridY}, bestBrick, false);
                } else if(p.aiType === "coward") {
                    // Huir al centro o a zona segura
                    move = aStarPath({x:p.gridX, y:p.gridY}, {x:6, y:6}, true);
                } else if(p.aiType === "ambusher") {
                    // Ir a esquinas o cerca de ladrillos
                    if(p.hasAdjacentBrick() && Math.random() < 0.3) {
                        move = null;
                    } else {
                        move = aStarPath({x:p.gridX, y:p.gridY}, {x:3, y:3}, false);
                    }
                }
                
                // Movimiento por defecto
                if(!move && targetPos) {
                    move = aStarPath({x:p.gridX, y:p.gridY}, targetPos, true);
                }
                if(!move) {
                    let dirs = ['up', 'down', 'left', 'right'];
                    for(let dir of dirs) {
                        let dx=0,dy=0;
                        if(dir==='up') dy=-1;
                        else if(dir==='down') dy=1;
                        else if(dir==='left') dx=-1;
                        else if(dir==='right') dx=1;
                        if(p.canMoveTo(dx,dy,true,true)) {
                            move = dir;
                            break;
                        }
                    }
                }
                
                if(move && p.startMove(move)) {
                    p.currentMoveTarget = move;
                    p.aiDecisionCooldown = diff.reactionDelay;
                }
            }
        }
        
        function initMap() {
            let newMap = Array(MAP_SIZE).fill().map(()=>Array(MAP_SIZE).fill(TILE_EMPTY));
            for(let i=0;i<MAP_SIZE;i++) {
                newMap[0][i]=TILE_WALL;
                newMap[MAP_SIZE-1][i]=TILE_WALL;
                newMap[i][0]=TILE_WALL;
                newMap[i][MAP_SIZE-1]=TILE_WALL;
            }
            for(let y=2; y<MAP_SIZE-2; y+=2) {
                for(let x=2; x<MAP_SIZE-2; x+=2) {
                    newMap[y][x]=TILE_WALL;
                }
            }
            const startPos = [[1,1],[1,11],[11,1],[11,11],[6,6]];
            for(let y=1; y<MAP_SIZE-1; y++) {
                for(let x=1; x<MAP_SIZE-1; x++) {
                    if(newMap[y][x]===TILE_EMPTY && Math.random()<0.44) {
                        let isStart = startPos.some(s=>s[0]===x && s[1]===y);
                        let nearStart = startPos.some(s=>Math.abs(s[0]-x)<=1 && Math.abs(s[1]-y)<=1);
                        if(!isStart && !nearStart) newMap[y][x]=TILE_BRICK;
                    }
                }
            }
            return newMap;
        }
        
        function resetGame() {
            gameRunning=true;
            statusDiv.innerText = "?? BATALLA ACTIVA";
            statusDiv.style.color = "#f7d44a";
            map = initMap();
            const startPos = [[1,1],[1,11],[11,1],[11,11],[6,6]];
            players = [];
            for(let i=0;i<PLAYER_COUNT;i++) {
                players.push(new Player(i, PLAYER_NAMES[i], PLAYER_COLORS[i], startPos[i][0], startPos[i][1], i===HUMAN_ID));
            }
            bombs = [];
            explosions = [];
            powerups = [];
            pendingDirection = null;
            updateUI();
            rankingContainer.innerHTML = "?? COMBATE EN CURSO ??";
        }
        
        function updateUI() {
            let aliveCount = players.filter(p=>p.alive).length;
            vivosDiv.innerText = `?? Vivos: ${aliveCount}/${PLAYER_COUNT}`;
            statsContainer.innerHTML = players.map(p=>{
                if(!p.alive) return `<div class="player-stat" style="background:#222;">?? ${p.name}</div>`;
                let spd = p.speedBoost===0?"??":(p.speedBoost===1?"?":"??");
                let icon = p.isHuman?"??":(p.aiType==="aggressive"?"??":(p.aiType==="destroyer"?"??":(p.aiType==="coward"?"??":(p.aiType==="ambusher"?"??":"??"))));
                return `<div class="player-stat" style="border-left: 4px solid ${p.color};">${icon} ${p.name}: ??${p.bombRange} ??${p.maxBombs} ${spd} ??${p.kills}</div>`;
            }).join('');
        }
        
        function applyExplosionDamage(cx,cy,range,ownerId) {
            let affected=[];
            let dirs=[[0,0],[0,-1],[0,1],[-1,0],[1,0]];
            for(let [dx,dy] of dirs) {
                for(let r=0;r<=range;r++) {
                    let nx=cx+dx*r, ny=cy+dy*r;
                    if(nx<0||nx>=MAP_SIZE||ny<0||ny>=MAP_SIZE) break;
                    if(map[ny][nx]===TILE_WALL) break;
                    affected.push({x:nx,y:ny});
                    if(map[ny][nx]===TILE_BRICK) break;
                }
            }
            
            for(let b of bombs) {
                for(let cell of affected) {
                    if(b.x===cell.x && b.y===cell.y) b.timer=0;
                }
            }
            
            for(let cell of affected) {
                if(map[cell.y][cell.x]===TILE_BRICK) {
                    map[cell.y][cell.x]=TILE_EMPTY;
                    let owner=players.find(p=>p.id===ownerId);
                    if(owner) owner.addBrickDestroyed();
                    if(Math.random()<0.35) {
                        powerups.push({x:cell.x, y:cell.y, type: Math.floor(Math.random()*3)});
                    }
                }
            }
            
            for(let p of players) {
                if(!p.alive) continue;
                for(let cell of affected) {
                    if(p.gridX===cell.x && p.gridY===cell.y) {
                        let owner=players.find(pl=>pl.id===ownerId);
                        if(owner && owner.id!==p.id) owner.addKill();
                        p.die();
                        break;
                    }
                }
            }
            
            for(let cell of affected) {
                explosions.push({x:cell.x, y:cell.y, timer:12});
            }
            cameraShake = 8;
        }
        
        function updateBombs() {
            for(let i=0;i<bombs.length;i++) {
                let b=bombs[i];
                b.timer--;
                if(b.timer<=0) {
                    applyExplosionDamage(b.x,b.y,b.range,b.ownerId);
                    let owner=players.find(p=>p.id===b.ownerId);
                    if(owner && owner.alive && owner.bombsPlaced>0) owner.bombsPlaced--;
                    bombs.splice(i,1);
                    i--;
                }
            }
            for(let i=0;i<explosions.length;i++) {
                explosions[i].timer--;
                if(explosions[i].timer<=0) {
                    explosions.splice(i,1);
                    i--;
                }
            }
        }
        
        function updatePowerups() {
            for(let i=0;i<powerups.length;i++) {
                let pu=powerups[i];
                for(let p of players) {
                    if(p.alive && p.gridX===pu.x && p.gridY===pu.y && !p.isMoving()) {
                        p.applyPowerup(pu.type);
                        powerups.splice(i,1);
                        i--;
                        break;
                    }
                }
            }
        }
        
        function handleInput() {
            if(!gameRunning) return;
            const h=players[HUMAN_ID];
            if(!h||!h.alive||h.isMoving()) return;
            let dir=null;
            if(keys.ArrowUp) dir='up';
            else if(keys.ArrowDown) dir='down';
            else if(keys.ArrowLeft) dir='left';
            else if(keys.ArrowRight) dir='right';
            if(dir) {
                if(!h.startMove(dir)) pendingDirection=dir;
                else pendingDirection=null;
            }
        }
        
        function checkWinner() {
            let alive=players.filter(p=>p.alive);
            if(alive.length===1 && gameRunning) {
                gameRunning=false;
                statusDiv.innerText = alive[0].id===HUMAN_ID ? "?? VICTORIA  PICA ??" : `?? Gana ${alive[0].name}`;
                let rank=[...players].sort((a,b)=> (b.kills*100 + b.powerupsCollected*20 + b.bricksDestroyed*5 - b.suicides*50) - (a.kills*100 + a.powerupsCollected*20 + a.bricksDestroyed*5 - a.suicides*50));
                rankingContainer.innerHTML = "?? RANKING AVANZADO ??<br>"+rank.map((p,i)=>`${i+1}. ${p.name}: Kills:${p.kills} ?${p.powerupsCollected} ??${p.bricksDestroyed}`).join("<br>");
            } else if(alive.length===0 && gameRunning) {
                gameRunning=false;
                statusDiv.innerText="?? EMPATE TOTAL ??";
                rankingContainer.innerHTML="?? NADIE SOBREVIVE ??";
            }
            updateUI();
        }
        
        function draw() {
            ctx.clearRect(0,0,650,650);
            if(cameraShake>0) {
                ctx.translate((Math.random()-0.5)*4, (Math.random()-0.5)*4);
                cameraShake--;
            }
            
            // Dibujar mapa
            for(let y=0;y<MAP_SIZE;y++) {
                for(let x=0;x<MAP_SIZE;x++) {
                    let px=x*CELL_SIZE, py=y*CELL_SIZE;
                    if(map[y][x]===TILE_WALL) {
                        ctx.fillStyle="#5d5d5d";
                        ctx.fillRect(px,py,CELL_SIZE-1,CELL_SIZE-1);
                        ctx.fillStyle="#3a3a3a";
                        ctx.fillRect(px+5,py+5,CELL_SIZE-11,CELL_SIZE-11);
                    } else if(map[y][x]===TILE_BRICK) {
                        ctx.fillStyle="#b87c4f";
                        ctx.fillRect(px,py,CELL_SIZE-1,CELL_SIZE-1);
                        ctx.fillStyle="#8b5a2b";
                        ctx.fillRect(px+4,py+4,CELL_SIZE-9,CELL_SIZE-9);
                    } else {
                        ctx.fillStyle="#3e6b53";
                        ctx.fillRect(px,py,CELL_SIZE-1,CELL_SIZE-1);
                    }
                }
            }
            
            // Powerups
            for(let pu of powerups) {
                let px=pu.x*CELL_SIZE, py=pu.y*CELL_SIZE;
                ctx.fillStyle="#ffaa66";
                ctx.beginPath();
                ctx.arc(px+25,py+25,14,0,2*Math.PI);
                ctx.fill();
                ctx.font="bold 24px monospace";
                ctx.fillStyle="#000";
                let icon=pu.type===POWERUP_RANGE?"??":(pu.type===POWERUP_BOMBS?"??":"??");
                ctx.fillText(icon,px+16,py+38);
            }
            
            // Bombas
            for(let b of bombs) {
                let px=b.x*CELL_SIZE, py=b.y*CELL_SIZE;
                ctx.fillStyle="#111";
                ctx.fillRect(px+8,py+8,34,34);
                ctx.fillStyle=`rgba(255,51,51,0.9)`;
                ctx.beginPath();
                ctx.arc(px+25,py+25,14,0,2*Math.PI);
                ctx.fill();
                ctx.font="22px monospace";
                ctx.fillStyle="white";
                ctx.fillText("??",px+17,py+35);
            }
            
            // Explosiones
            for(let ex of explosions) {
                let px=ex.x*CELL_SIZE, py=ex.y*CELL_SIZE;
                ctx.fillStyle="#ff8822";
                ctx.fillRect(px,py,CELL_SIZE,CELL_SIZE);
                ctx.fillStyle="#ff4400";
                ctx.fillRect(px+12,py+12,26,26);
                for(let i=0;i<5;i++) {
                    ctx.fillStyle=`rgba(255,80,0,0.7)`;
                    ctx.fillRect(px+Math.random()*CELL_SIZE, py+Math.random()*CELL_SIZE,6,6);
                }
            }
            
            // Jugadores
            for(let p of players) {
                if(!p.alive) continue;
                let px=p.pixelX, py=p.pixelY + (p.walkBob*0.8);
                ctx.shadowBlur=8;
                ctx.shadowColor="black";
                ctx.fillStyle=p.color;
                ctx.beginPath();
                ctx.ellipse(px+25, py+22, 16, 18, 0, 0, 2*Math.PI);
                ctx.fill();
                ctx.fillStyle="#8B7355";
                ctx.fillRect(px+15, py+6, 20, 8);
                ctx.fillStyle="#D2B48C";
                ctx.fillRect(px+18, py+3, 14, 6);
                ctx.fillStyle="white";
                ctx.beginPath();
                ctx.arc(px+20, py+21, 4, 0, 2*Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px+30, py+21, 4, 0, 2*Math.PI);
                ctx.fill();
                ctx.fillStyle="#000";
                let eyeShift = p.animFrame===1?2:0;
                ctx.beginPath();
                ctx.arc(px+20+eyeShift, py+21, 2, 0, 2*Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px+30+eyeShift, py+21, 2, 0, 2*Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(px+25, py+29, 6, 0.1, Math.PI-0.1);
                ctx.stroke();
                if(p.speedBoost>0) {
                    ctx.fillStyle="#ffff88";
                    ctx.beginPath();
                    ctx.arc(px+25, py+25-20, 6, 0, 2*Math.PI);
                    ctx.fill();
                }
                ctx.shadowBlur=0;
            }
            
            if(cameraShake) ctx.setTransform(1,0,0,1,0,0);
        }
        
        function update() {
            if(!gameRunning) return;
            handleInput();
            updateBots();
            for(let p of players) p.updateMove();
            for(let p of players) p.updateCooldown();
            updateBombs();
            updatePowerups();
            checkWinner();
        }
        
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        window.addEventListener('keydown',(e)=>{
            if(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight') {
                e.preventDefault();
                keys[e.key]=true;
            }
            if(e.key===' '||e.key==='Space') {
                e.preventDefault();
                let h=players[HUMAN_ID];
                if(h && h.alive && gameRunning && !h.isMoving()) {
                    h.tryPlaceBomb();
                }
            }
        });
        
        window.addEventListener('keyup',(e)=>{
            if(keys.hasOwnProperty(e.key)) keys[e.key]=false;
        });
        
        document.getElementById('resetBtn').addEventListener('click',()=>{
            resetGame();
            canvas.focus();
        });
        
        resetGame();
        gameLoop();
        canvas.focus();
    })();
</script>
</body>
